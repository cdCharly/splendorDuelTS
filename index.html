<!DOCTYPE html>
<html lang="fr">
<head>
    <title>Splendor Duel</title>
    <meta charset="utf-8">
    <link rel="stylesheet" type="text/css" href="style.css">
    
    <!-- 1. Le navigateur charge d'abord la communication réseau -->
    <script src="http://192.168.1.50:3000/socket.io/socket.io.js"></script>
    
    <!-- 2. Ensuite seulement, il charge la logique de votre jeu UNE SEULE fois -->
    <script src="script.js" defer></script>
</head>

<body>
<!-- le bouton appele la fonction declencherAffichage--> 
    <button type="button" onclick="declencherAffichage()">Afficher Paquet</button>
    
    <!-- endroit ou le paquet crée les balises p avec les infos dedans-->
    <div id="paquet-affichage"></div>


    <!-- À ajouter dans la balise <body> de index.html -->
    <h2 id = "plateauName" class="plateau-name">Plateau de Jeu</h2>
    
    <!--
    <div id="plateauAffichage" class="grille-plateau"></div>
    ca fonctionne mieux avec la balise
    -->
    <div id="plateauAffichage" class="grille-plateau" style="background-image: url('apercus/plateausplendorduel3.png');
            background-size: cover; background-position: center; background-repeat: no-repeat;"></div>


    <button type="button" onclick="validerPioche()">Prendre les jetons</button>




            <!-- Zone d'affichage des jetons récoltés -->
    <div class="zone-inventaires">
        <div id="inventaire-j1" class="inventaire-joueur">
            <h3>Joueur 1</h3>
            <div id="poche-j1" class="contenu-poche"></div>
        </div>

        <div id="inventaire-j2" class="inventaire-joueur">
            <h3>Joueur 2</h3>
            <div id="poche-j2" class="contenu-poche"></div>
        </div>
    </div>








   <div class="zone-cartes-gauche">
    
    <!-- Colonne Niveau 1 (Vert) -->
    <div class="colonne-niveau">
        <div class="dos-pioche" style="background-image: url('apercus/cartelv1.png');"></div>
        <div class="carte-noire"></div>
        <div class="carte-noire"></div>
        <div class="carte-noire"></div>
        <div class="carte-noire"></div>
        <div class="carte-noire"></div>
    </div>

    <!-- Colonne Niveau 2 (Marron) -->
    <div class="colonne-niveau">
        <div class="dos-pioche" style="background-image: url('apercus/cartelv2.png');"></div>
        <div class="carte-noire"></div>
        <div class="carte-noire"></div>
        <div class="carte-noire"></div>
        <div class="carte-noire"></div>
    </div>

    <!-- Colonne Niveau 3 (Bleu) -->
    <div class="colonne-niveau">
        <div class="dos-pioche" style="background-image: url('apercus/cartelv3.png');"></div>
        <div class="carte-noire"></div>
        <div class="carte-noire"></div>
        <div class="carte-noire"></div>
    </div>

</div>


    



</body>
</html>
