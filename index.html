<!DOCTYPE html>
<html lang="fr">
<head>
    <title>Splendor Duel</title>
    <meta charset="utf-8">
    <link rel="stylesheet" type="text/css" href="style.css">
    
    <!-- 1. Le navigateur charge d'abord la communication réseau -->
    <script src="http://192.168.1.50:3000/socket.io/socket.io.js"></script>
    
    <!-- 2. Ensuite seulement, il charge la logique de votre jeu UNE SEULE fois -->
    <script src="script.js" defer></script>
</head>

<body>
    <!-- Zone de test pour l'affichage brut --> 
    <button type="button" onclick="declencherAffichage()">Afficher Paquet</button>
    <div id="paquet-affichage"></div>

    <!-- Titre et privilèges du plateau central -->
    <h2 id="plateauName" class="plateau-name">Plateau de Jeu</h2>
    <div id="zone-privileges-plateau" class="zone-privileges"></div>

    <!-- Le plateau de jeu -->
    <div id="plateauAffichage" class="grille-plateau" style="background-image: url('apercus/plateausplendorduel3.png'); background-size: cover; background-position: center; background-repeat: no-repeat;"></div>

    <button type="button" onclick="validerPioche()">Prendre les jetons</button>
    <!-- L'inventaire de l'adversaire (en haut à droite) -->
    <div id="zone-adversaire" class="inventaire-adversaire">
        <div class="inventaire-gauche">
            <h3 id="titre-adversaire">Adversaire</h3>
            <div id="privileges-adversaire" class="zone-privileges-joueur"></div>
            <div id="poche-adversaire" class="contenu-poche"></div>
        </div>
        <div class="inventaire-droite">
            <h3>Cartes</h3>
            <div id="paquet-adversaire" class="paquet-joueur"></div>
        </div>
    </div>

    <!-- L'inventaire du joueur local (en dessous du plateau) -->
    <div id="zone-locale" class="inventaire-local">
        <div class="inventaire-gauche">
            <h3 id="titre-local">Mes jetons</h3>
            <div id="privileges-local" class="zone-privileges-joueur"></div>
            <div id="poche-locale" class="contenu-poche"></div>
        </div>
        <div class="inventaire-droite">
            <h3>Mes Cartes</h3>
            <div id="paquet-local" class="paquet-joueur"></div>
        </div>
    </div>


    <!-- La rivière de cartes (à gauche) -->
    <div class="zone-cartes-gauche">
        
        <!-- Colonne Niveau 1 (Vert) -->
        <div id="colonneLv1" class="colonne-niveau">
            <div class="dos-pioche" style="background-image: url('apercus/cartelv1.png');"></div>
            <div class="carte-noire"></div>
            <div class="carte-noire"></div>
            <div class="carte-noire"></div>
            <div class="carte-noire"></div>
            <div class="carte-noire"></div>
        </div>

        <!-- Colonne Niveau 2 (Marron) -->
        <div id="colonneLv2" class="colonne-niveau">
            <div class="dos-pioche" style="background-image: url('apercus/cartelv2.png');"></div>
            <div class="carte-noire"></div>
            <div class="carte-noire"></div>
            <div class="carte-noire"></div>
            <div class="carte-noire"></div>
        </div>

        <!-- Colonne Niveau 3 (Bleu) -->
        <div id="colonneLv3" class="colonne-niveau">
            <div class="dos-pioche" style="background-image: url('apercus/cartelv3.png');"></div>
            <div class="carte-noire"></div>
            <div class="carte-noire"></div>
            <div class="carte-noire"></div>
        </div>

    </div>

</body>
</html>
